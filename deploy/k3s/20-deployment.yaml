apiVersion: apps/v1
kind: Deployment
metadata:
  name: 4caster
  namespace: 4caster
  labels:
    app: 4caster
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: 4caster
  template:
    metadata:
      labels:
        app: 4caster
    spec:
      containers:
        - name: 4caster
          image: ghcr.io/hud0shnik/4caster:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: 4caster-telegram
                  key: TELEGRAM_BOT_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
